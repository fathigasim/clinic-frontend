name: Build Clinic Frontend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    # Removed the global working-directory default since files are at the root
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        # Fixed: Changed to look directly at the repository root
        cache-dependency-path: ./package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint --if-present

    - name: Build
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: clinic-client-dist
        # Fixed: Vite will output to a 'dist' folder at the root level
        path: ./dist