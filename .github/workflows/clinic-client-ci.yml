name: Build Clinic Frontend

on:
  push:
    branches: [ main ]  # Triggers the workflow whenever you push to main
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clinic-front   # Every 'run:' command happens inside here
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./clinic-front/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint --if-present

    - name: Build
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: clinic-client-dist
        path: ./clinic-front/dist